<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shubham Store</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #1a1a1a; color: white; }
        .product-card { border: 1px solid #444; padding: 20px; margin: 10px; display: inline-block; border-radius: 10px; background: #222; width: 250px; }
        .product-card img { width: 100%; border-radius: 5px; }
        .price { color: #ffcc00; font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Shubham Store - New Arrivals</h1>
    <div id="product-list">
        {% for product in products %}
        <div class="product-card">
            <img src="{{ product.img }}" alt="{{ product.name }}">
            <h3>{{ product.name }}</h3>
            <p class="price">₹{{ product.price }}</p>
            <button style="padding: 10px; background: #ffcc00; border: none; border-radius: 5px; cursor: pointer;">Buy Now</button>
        </div>
        {% endfor %}
    </div>
    <br>
    <a href="/admin" style="color: #888;">Admin Login</a>
</body>
</html>
